# Deep sleep after idle — battery saver for wireless use.
CONFIG_ZMK_SLEEP=y

# nice!view display support (both halves have one).
# Do NOT set ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN here: the nice_view shield
# defaults to ZMK_DISPLAY_STATUS_SCREEN_CUSTOM, which is what implies
# NICE_VIEW_WIDGET_STATUS and compiles the art + status widgets. Forcing
# BUILT_IN replaces them with Zephyr's generic screen and silently drops
# the custom art.
CONFIG_ZMK_DISPLAY=y
