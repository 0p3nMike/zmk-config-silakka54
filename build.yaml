# Generates the GitHub Actions build matrix. One entry per UF2 artifact.
# Studio runs only on the central (left) half: the snippet exposes the
# Studio RPC transport over USB, the cmake arg compiles Studio support in.
include:
  - board: nice_nano_v2
    shield: silakka54_left nice_view_adapter nice_view_ether
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: silakka54_right nice_view_adapter nice_view_ether
  - board: nice_nano_v2
    shield: settings_reset
